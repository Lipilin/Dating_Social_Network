services:
  backend:
    build: 
      context: ./backend
      target: develop
    depends_on:
      - mysql
    volumes:
      - ./backend/src:/app/src
    ports:
      - "3000:3000"
    env_file:
      - .env

  mysql:
    image: mysql:8
    volumes:
      - mysql_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

  frontend:
    build: 
      context: ./frontend
    depends_on:
      - backend
    volumes:
      - ./frontend/src:/app/src
    ports:
      - "5173:5173"

volumes:
  mysql_data: